server:
  name: aimock-docs
  version: "1.0.0"
  max_sessions: 1000
  session_ttl_minutes: 30
  session_unused_ttl_minutes: 15
  # Anthropic crawler — bypasses per-IP session limit (requires trust_proxy to be
  # set so the allowlist matches the forwarded client IP, not the proxy's)
  allowlist: ["160.79.106.35"]
  # Numeric hop count, NOT `true`. Exactly one proxy sits in front of this
  # container: Railway's edge terminates TLS and forwards to the Node process
  # (no CDN, no in-container reverse proxy). `trust proxy: 1` therefore tells
  # Express to trust that single hop and resolve req.ip to the address the
  # edge itself appended.
  #
  # `true` would be a vulnerability here: it trusts EVERY hop and resolves
  # req.ip to the LEFTMOST X-Forwarded-For entry, which is client-supplied.
  # Any caller could send `X-Forwarded-For: 160.79.106.35` and be attributed
  # to the allowlisted crawler above — bypassing the per-IP session limit and
  # poisoning query_log IP attribution. With a hop count, a forged prefix is
  # ignored because the edge appends the real peer to the right of it.
  # See src/ip-util.ts for the full rationale.
  trust_proxy: 1

sources:
  - name: docs
    type: html
    repo: https://github.com/CopilotKit/aimock.git
    path: docs/
    base_url: https://aimock.copilotkit.dev/
    url_derivation:
      strip_prefix: "docs/"
      strip_suffix: ".html"
      strip_index: true
    file_patterns:
      - "**/*.html"
    chunk:
      target_tokens: 600
      overlap_tokens: 50

  - name: code
    type: code
    repo: https://github.com/CopilotKit/aimock.git
    path: src/
    file_patterns:
      - "**/*.ts"
    exclude_patterns:
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
    skip_dirs:
      - node_modules
      - dist
      - .git
    max_file_size: 102400
    chunk:
      target_lines: 80
      overlap_lines: 10

tools:
  - name: search-docs
    type: search
    description: "Search aimock documentation for guides on mocking LLM APIs, fixture authoring, provider configuration, streaming, and test integration. This is a semantic search, so prefer performing multiple queries with different phrases instead of a single long query, until you find all the context you need."
    source: docs
    default_limit: 5
    max_limit: 20
    result_format: docs

  - name: search-code
    type: search
    description: "Search the aimock codebase to find implementations of routers, providers, response builders, mock handlers, and fixture loaders. This is a semantic search, so prefer performing multiple queries with different phrases instead of a single long query, until you find all the context you need."
    source: code
    default_limit: 10
    max_limit: 20
    result_format: code

  - name: explore-docs
    type: bash
    description: 'Explore aimock documentation files using bash commands (find, grep, cat, ls, head). Start with ''find / -name "*.html" | head -20'' or ''cat /INDEX.md'' to see what''s available.'
    sources: [docs]
    bash:
      session_state: true
      grep_strategy: hybrid
      virtual_files: true

  - name: explore-code
    type: bash
    description: 'Explore aimock source code using bash commands (find, grep, cat, ls, head). Start with ''find / -name "*.ts" | head -20'' to see what''s available.'
    sources: [code]
    bash:
      session_state: true
      grep_strategy: hybrid
      virtual_files: true

  - name: submit-feedback
    type: collect
    description: "After using search results, submit feedback on whether the advice worked or not. Report what you tried and whether it succeeded or failed."
    response: "Feedback recorded. Thank you."
    schema:
      tool_name:
        type: string
        description: "Which search tool was used"
        required: true
      query:
        type: string
        description: "The original search query"
        required: true
      rating:
        type: enum
        values: ["helpful", "not_helpful"]
        description: "Whether the results were helpful"
        required: true
      comment:
        type: string
        description: "What was tried, what failed/worked, what info was missing"
        required: true

embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536

indexing:
  auto_reindex: true
  reindex_hour_utc: 3
  stale_threshold_hours: 24

analytics:
  enabled: true

webhook:
  repo_sources:
    "CopilotKit/aimock":
      - docs
      - code
  path_triggers:
    docs:
      - "docs/"
    code:
      - "src/"
