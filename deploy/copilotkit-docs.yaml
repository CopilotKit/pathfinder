server:
  name: copilotkit-docs-mcp
  version: "1.0.0"
  max_sessions: 1000
  session_ttl_minutes: 30
  session_unused_ttl_minutes: 15
  # Anthropic crawler — bypasses per-IP session limit (requires trust_proxy: true to match the forwarded IP)
  allowlist: ["160.79.106.35"]
  # Safe to enable: Railway's edge discards any client-supplied X-Forwarded-For
  # and sets its own trusted value, so the leftmost XFF entry is the real peer.
  trust_proxy: true

sources:
  - name: docs
    type: markdown
    repo: https://github.com/CopilotKit/CopilotKit.git
    # Walk from src/content/ rather than src/content/docs/ so the API
    # reference tree is reachable. It is a SIBLING of the prose docs —
    # src/content/reference/, rendered by src/app/reference/[...slug] —
    # so a walk rooted at src/content/docs/ can never see it, which is why
    # only the one stray reference page committed under the prose tree
    # (docs/reference/v2/hooks/useCapabilities.mdx) was ever indexed.
    path: showcase/shell-docs/src/content/
    base_url: https://docs.copilotkit.ai/
    url_derivation:
      # First match wins, so the longer docs/ prefix must precede the
      # shorter content/ one. Prose pages live at the site root
      # (docs/quickstart.mdx -> /quickstart); reference pages keep their
      # directory (reference/hooks/useAgent.mdx -> /reference/hooks/useAgent,
      # which the [...slug] route serves as the v2 root SDK).
      strip_prefix:
        - "showcase/shell-docs/src/content/docs/"
        - "showcase/shell-docs/src/content/"
      strip_suffix: ".mdx"
      strip_route_groups: true
      strip_index: true
    # Repo-root-relative, and load-bearing: the wide walk root also exposes
    # snippets/ (MDX partials) and framework-overviews/, neither of which is
    # a standalone page. These patterns are also what scopes the incremental
    # webhook path, which filters changed files by pattern alone with no
    # walk-root check.
    #
    # ag-ui/ IS listed: those 96 files are live pages on THIS site,
    # docs.copilotkit.ai/ag-ui/<slug>, served by src/app/ag-ui/[[...slug]],
    # and all 96 are in the production sitemap. CopilotKit includes AG-UI, so
    # they belong in the CopilotKit docs index. They are near-duplicates of
    # the upstream ag-ui-protocol/ag-ui docs tree indexed by the `ag-ui-docs`
    # source below, but that copy answers for docs.ag-ui.com and hands back
    # docs.ag-ui.com links; this one hands back the copilotkit.ai links a
    # CopilotKit user is reading. The ordered strip_prefix above needs no
    # change for them — ag-ui/ is not under content/docs/, so it falls
    # through to the content/ prefix and keeps its directory:
    # content/ag-ui/concepts/agents.mdx -> /ag-ui/concepts/agents.
    file_patterns:
      - "showcase/shell-docs/src/content/docs/**/*.mdx"
      - "showcase/shell-docs/src/content/reference/**/*.mdx"
      - "showcase/shell-docs/src/content/ag-ui/**/*.mdx"
    # Trees in this repo that hold .mdx but are CORRECTLY unclaimed, recorded
    # so the unclaimed-content audit (reindex-audit Check 4) stays quiet about
    # them. Pooled across every source reading CopilotKit/CopilotKit.
    #   snippets/  — MDX partials inlined into pages at render time; they are
    #                never standalone pages and their prose is already indexed
    #                through the pages that include them.
    #   examples/  — per-example READMEs for the demo apps, not on the site.
    #   showcase/integrations/ — per-integration setup notes that live with
    #                the integration app, not on docs.copilotkit.ai.
    # content/ag-ui/ is deliberately absent from this list and always will
    # be: it is not exempt, it is CLAIMED by the file_patterns above. An
    # exemption there would re-blind the audit to a tree of live pages.
    unclaimed_exempt_paths:
      - "showcase/shell-docs/src/content/snippets"
      - "examples"
      - "showcase/integrations"
    chunk:
      target_tokens: 600
      overlap_tokens: 50

  - name: code
    type: code
    repo: https://github.com/CopilotKit/CopilotKit.git
    path: "."
    file_patterns:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.py"
    exclude_patterns:
      - "packages/v1/**"
      - "packages/v1-*/**"
      - "**/test/**"
      - "**/tests/**"
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      # Demo/example apps and the docs site Next.js build are not library code
      - "examples/**"
      - "showcase/**"
      - "**/.next/**"
      # Generated type declarations duplicate the .ts sources they describe
      - "**/*.d.ts"
    skip_dirs:
      - node_modules
      - dist
      - build
      - .git
    max_file_size: 102400
    chunk:
      target_lines: 80
      overlap_lines: 10

  - name: ag-ui-docs
    type: markdown
    repo: https://github.com/ag-ui-protocol/ag-ui.git
    path: docs/
    base_url: https://docs.ag-ui.com/
    url_derivation:
      strip_prefix: "docs/"
      strip_suffix: ".mdx"
      strip_route_groups: true
      strip_index: true
    file_patterns:
      # .mdx only — the docs/ tree's two .md files (README.md, ag_ui.md) are a
      # folder README and a raw spec, not rendered product pages, and keep their
      # extension under a .mdx-only strip_suffix, deriving 404 URLs.
      - "**/*.mdx"
    chunk:
      target_tokens: 600
      overlap_tokens: 50

  - name: ag-ui-code
    type: code
    repo: https://github.com/ag-ui-protocol/ag-ui.git
    # Walk from the repo root so the TS SDK, the Python adapters under
    # integrations/, the Python SDK, and the JVM/multi-language community SDK
    # are all reachable. file_patterns (matched against repo-root-relative
    # paths) scope which subtrees actually get indexed.
    path: "."
    file_patterns:
      # TypeScript SDK packages
      - "sdks/typescript/packages/**/*.ts"
      - "sdks/typescript/packages/**/*.tsx"
      - "sdks/typescript/packages/**/*.js"
      - "sdks/typescript/packages/**/*.jsx"
      # Framework integrations (Python adapters + TS bindings)
      - "integrations/**/*.py"
      - "integrations/**/*.ts"
      # Python SDK
      - "sdks/python/**/*.py"
      # Community SDK — JVM (Kotlin/Java) plus the other native ports that
      # live under sdks/community/ (go, rust, dart, ruby)
      - "sdks/community/**/*.kt"
      - "sdks/community/**/*.java"
      - "sdks/community/**/*.go"
      - "sdks/community/**/*.rs"
      - "sdks/community/**/*.dart"
      - "sdks/community/**/*.rb"
    exclude_patterns:
      - "**/test/**"
      - "**/tests/**"
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      # Codegen output — protobuf codec + generated stubs dominate and add no
      # hand-written signal
      - "**/generated/**"
      - "**/*.pb.*"
    # Correctly unclaimed in ag-ui-protocol/ag-ui (see Check 4 above):
    #   apps/         — the dojo demo app and its READMEs; demo code, not SDK.
    #   sdks/dotnet/  — the only .ts under it is the cross-language Vitest
    #                   harness that drives the .NET server.
    # NOT listed: middlewares/. Those are six published @ag-ui/* packages
    # whose source no search tool can reach today.
    unclaimed_exempt_paths:
      - "apps"
      - "sdks/dotnet"
    skip_dirs:
      - node_modules
      - dist
      - build
      - .git
    max_file_size: 102400
    chunk:
      target_lines: 80
      overlap_lines: 10

tools:
  - name: search-docs
    type: search
    description: "Search the CopilotKit product documentation (https://docs.copilotkit.ai) — guides, concepts, quickstarts, API reference, how-tos for building with CopilotKit, and the AG-UI protocol pages hosted on the CopilotKit docs site (docs.copilotkit.ai/ag-ui/...). Use this for CopilotKit usage and configuration questions. For the upstream AG-UI protocol documentation at docs.ag-ui.com use search-ag-ui-docs; for source code use search-code. This is a semantic search, so prefer performing multiple queries with different phrases instead of a single long query, until you find all the context you need."
    source: docs
    default_limit: 5
    max_limit: 20
    result_format: docs
    search_mode: hybrid
    min_score: 0.3

  - name: search-code
    type: search
    description: "Search the CopilotKit/CopilotKit source code (React UI, hooks, runtime, CSS, framework adapters) to understand how something is implemented or find code examples. Covers library/package source only — NOT example or showcase apps, NOT generated .d.ts type declarations, and NOT the AG-UI protocol SDK (use search-ag-ui-code for that). This is a semantic search, so prefer performing multiple queries with different phrases instead of a single long query, until you find all the context you need."
    source: code
    default_limit: 10
    max_limit: 20
    result_format: code
    search_mode: hybrid
    min_score: 0.3

  - name: search-ag-ui-docs
    type: search
    description: "Search the upstream AG-UI protocol documentation (https://docs.ag-ui.com) — the Agent-User Interaction protocol spec, event types, message schemas, and framework integration guides. Use this for protocol-level questions about AG-UI when you want the canonical ag-ui.com source; the CopilotKit docs site hosts its own near-identical copy of these pages, which search-docs returns with docs.copilotkit.ai links. NOT for CopilotKit product docs (use search-docs) and NOT for source code (use search-ag-ui-code). This is a semantic search, so prefer performing multiple queries with different phrases instead of a single long query, until you find all the context you need."
    source: ag-ui-docs
    default_limit: 5
    max_limit: 20
    result_format: docs
    search_mode: hybrid
    min_score: 0.3

  - name: search-ag-ui-code
    type: search
    description: "Search the AG-UI protocol SDK source code across languages — TypeScript SDK packages, the Python SDK and framework integration adapters (LangGraph, CrewAI, etc.), and the JVM/multi-language community SDK. Use this to understand AG-UI protocol types, events, encoders, and client/adapter implementations. This is AG-UI SDK code only — NOT CopilotKit React/CSS/hooks (use search-code) and NOT prose docs (use search-ag-ui-docs). This is a semantic search, so prefer performing multiple queries with different phrases instead of a single long query, until you find all the context you need."
    source: ag-ui-code
    default_limit: 10
    max_limit: 20
    result_format: code
    search_mode: hybrid
    min_score: 0.3

  - name: explore-docs
    type: bash
    description: 'Explore CopilotKit and AG-UI documentation files using bash commands (find, grep, cat, ls, head). Start with ''find / -name "*.mdx" | head -20'' or ''cat /INDEX.md'' to see what''s available.'
    sources: [docs, ag-ui-docs]
    bash:
      session_state: true
      grep_strategy: hybrid
      virtual_files: true

  - name: explore-code
    type: bash
    description: 'Explore CopilotKit and AG-UI source code files using bash commands (find, grep, cat, ls, head). Start with ''find / -name "*.ts" | head -20'' to see what''s available.'
    sources: [code, ag-ui-code]
    bash:
      session_state: true
      grep_strategy: hybrid
      virtual_files: true

  - name: submit-feedback
    type: collect
    description: "After using search results, you can submit feedback on whether the advice worked or not. Report what you tried and whether it succeeded or failed. If something failed but you later found the missing information elsewhere, mention that too. This feedback helps improve search quality."
    response: "Feedback recorded. Thank you."
    schema:
      tool_name:
        type: string
        description: "Which search tool was used"
        required: true
      query:
        type: string
        description: "The original search query"
        required: true
      rating:
        type: enum
        values: ["helpful", "not_helpful"]
        description: "Whether the results were helpful"
        required: true
      comment:
        type: string
        description: "What was tried, what failed/worked, what info was missing"
        required: true

embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536

indexing:
  auto_reindex: true
  reindex_hour_utc: 3
  stale_threshold_hours: 24

analytics:
  enabled: true
  # Machines that forward somebody else's text into the tools verbatim. Their
  # traffic is real but it is NOT a user query, so it is excluded from Top
  # Queries, the weekly search report, the gap analysis and the unique-IP /
  # session counts. The dashboard's "Excluded Machine-Relay Traffic" panel
  # enumerates what each rule removed; `?request_source=relay` on any
  # analytics endpoint reads the excluded rows back.
  #
  # Measured 2026-09-12 over a 7-day window: this relay produced 46 of 1,318
  # rows from ONE IP (152.55.178.126, inside Railway's 152.55.176.0/20) with
  # User-Agent `node`, against a legitimate control of 130 IPs across 58 UAs.
  # It had forwarded 23 SEO-spam GitHub issues into search-docs/search-code
  # within seconds of each being filed, and those bodies — 3.3 KB of
  # marketing copy carrying live backlinks — ranked in Top Queries and were
  # on course to be published verbatim into Notion.
  #
  # DELETE THIS RULE once the relay sends `X-Pathfinder-Source: github-triage`
  # at MCP session init: that header tags its rows `relay` and the exclusion
  # holds without any fingerprint. The rule is the bridge, not the fix.
  machine_relays:
    - name: github-issue-triage
      reason: >-
        CopilotKit GitHub-issue triage relay (Railway) — forwards every new
        issue body verbatim into search-docs/search-code
      user_agent: node
      client_ip_cidr: 152.55.176.0/20

  # Measured 2026-09-12 over the full 90-day retention (22,238 rows): User-Agent
  # `Python-urllib/3.9` accounts for 258 rows from ONE IP in ONE 55-second burst
  # (2026-09-10 15:30 UTC) — the single largest session in retention by 3.3x
  # (257 rows; the biggest legitimate session is 77 rows over 6 minutes). That
  # IP is a CopilotKit engineer's workstation, and `Python-urllib/3.9` is what
  # the macOS system `python3` (3.9.6) sends: an ad-hoc replay harness, run by
  # hand, that fired a de-duplicated corpus of 257 queries at search-docs /
  # search-code / search-ag-ui-*. 206 of those 258 distinct texts are VERBATIM
  # copies of queries other clients had already logged — the harness forwards
  # other people's text into the tools, which is exactly what this list is for.
  #
  # It is not abuse and it costs nothing to serve; what it does is impersonate
  # demand. In a 7-day window it was 252 of 1,258 Top Queries rows (20%), it
  # double-counted 20 real queries, and it contributed zero-result rows that
  # read as documentation gaps in the bi-weekly gap analysis.
  #
  # IDENTITY-shaped, and deliberately UA-only: no MCP client library speaks
  # stdlib urllib (the official Python MCP SDK uses httpx — see the
  # `python-httpx/*` traffic, which this rule does NOT touch), so this UA is
  # always a hand-rolled script. The source CIDR is omitted on purpose: it is a
  # residential dynamic address, so pinning it would be both brittle and a
  # personal-address leak in a public repo.
  #
  # DELETE THIS RULE once ad-hoc harnesses send `X-Pathfinder-Source: analysis`
  # at MCP session init — that tag already excludes them, with no fingerprint.
    - name: adhoc-python-replay-harness
      reason: >-
        Ad-hoc Python replay harness (macOS system python3, stdlib urllib) —
        refires a corpus of previously-logged queries in bulk
      user_agent: Python-urllib/3.9

webhook:
  repo_sources:
    "CopilotKit/CopilotKit":
      - docs
      - code
    "ag-ui-protocol/ag-ui":
      - ag-ui-docs
      - ag-ui-code
  path_triggers:
    docs:
      - "showcase/shell-docs/src/content/"
    code: []
    ag-ui-docs:
      - "docs/"
    ag-ui-code:
      - "sdks/typescript/packages/"
      - "integrations/"
      - "sdks/python/"
      - "sdks/community/"
