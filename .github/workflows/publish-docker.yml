name: Publish Docker
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          push: true
          tags: |
            ghcr.io/copilotkit/pathfinder:latest
            ghcr.io/copilotkit/pathfinder:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Notify Slack — success
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            payload=$(jq -nc --arg ref "$REF_NAME" \
              '{text: "Docker image published: ghcr.io/copilotkit/pathfinder:\($ref)"}')
            curl -sf -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "$payload" || true
          fi
      - name: Notify Slack — failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            payload=$(jq -nc --arg repo "$GH_REPOSITORY" --arg run "$GH_RUN_ID" \
              '{text: "Docker publish failed\n<https://github.com/\($repo)/actions/runs/\($run)|View run>"}')
            curl -sf -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "$payload" || true
          fi
