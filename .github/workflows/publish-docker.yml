name: Publish Docker
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Git tag / version to build and publish (e.g. v1.16.0)"
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK_OSS_ALERTS:
        description: "Slack webhook for OSS publish alerts (optional)"
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag / version to build and publish (e.g. v1.16.0)"
        required: true
        type: string
permissions: {}
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image ref
        id: ref
        env:
          # For push:tags the ref is github.ref_name; for workflow_call /
          # workflow_dispatch it comes from the explicit `tag` input.
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            REF="${INPUT_TAG}"
          else
            REF="${PUSH_REF}"
          fi
          if [ -z "${REF}" ]; then
            echo "::error::Could not resolve a tag/ref to build"
            exit 1
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Building Docker image for ref: ${REF}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # #88 — two image variants built in the SAME run from the SAME
      # Dockerfile, with DISJOINT tags:
      #   default (slim): no build-arg → :latest, :<ref>          ONLY
      #   local:  INCLUDE_LOCAL_EMBEDDINGS=true → :latest-local,
      #           :<ref>-local                                    ONLY
      # :latest / :<ref> always point at the slim default digest, never at
      # the -local digest. Both multi-arch; cache shared via type=gha. One
      # Slack notify summarizes both at the end of the job.
      - name: Build & push default (slim) image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          tags: |
            ghcr.io/copilotkit/pathfinder:latest
            ghcr.io/copilotkit/pathfinder:${{ steps.ref.outputs.ref }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push -local image (preinstalls @xenova/transformers)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          build-args: |
            INCLUDE_LOCAL_EMBEDDINGS=true
          tags: |
            ghcr.io/copilotkit/pathfinder:latest-local
            ghcr.io/copilotkit/pathfinder:${{ steps.ref.outputs.ref }}-local
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Notify Slack — success
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_OSS_ALERTS }}
          REF_NAME: ${{ steps.ref.outputs.ref }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            payload=$(jq -nc --arg ref "$REF_NAME" \
              '{text: "Docker images published: ghcr.io/copilotkit/pathfinder:\($ref) (slim) and :\($ref)-local (with @xenova/transformers)"}')
            curl -sf -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "$payload" || true
          fi
      - name: Notify Slack — failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_OSS_ALERTS }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            payload=$(jq -nc --arg repo "$GH_REPOSITORY" --arg run "$GH_RUN_ID" \
              '{text: "Docker publish failed\n<https://github.com/\($repo)/actions/runs/\($run)|View run>"}')
            curl -sf -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "$payload" || true
          fi
