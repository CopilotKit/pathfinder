name: Update Competitive Matrix
on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsx scripts/update-competitive-matrix.ts --summary /tmp/matrix-summary.md
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Configure git credentials for push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --local url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -b auto/competitive-matrix-update
          git add -A
          git commit -m "Update competitive matrix from weekly scan"
          git push -u origin auto/competitive-matrix-update
          PR_URL=$(gh pr create --title "Update competitive matrix" --body "$(cat /tmp/matrix-summary.md)" --base main)
          echo "url=$PR_URL" >> $GITHUB_OUTPUT
      - name: Notify Slack — changes detected
        if: steps.changes.outputs.changed == 'true'
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            payload=$(jq -nc --arg url "$PR_URL_OUTPUT" \
              '{text: "Competitive matrix updated — PR created\n<\($url)|View PR>"}')
            curl -sf -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "$payload" || true
          fi
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_OSS_ALERTS }}
          PR_URL_OUTPUT: ${{ steps.pr.outputs.url }}
      - name: Notify Slack — failure
        if: failure()
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            payload=$(jq -nc --arg repo "$GH_REPOSITORY" --arg run "$GH_RUN_ID" \
              '{text: "Competitive matrix scan failed\n<https://github.com/\($repo)/actions/runs/\($run)|View run>"}')
            curl -sf -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "$payload" || true
          fi
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_OSS_ALERTS }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
