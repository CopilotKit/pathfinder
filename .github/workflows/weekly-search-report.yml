name: Weekly Search Report
# Runs the Pathfinder weekly search-query report on a 7-day lookback and
# publishes a deterministic (no-LLM) report page to Notion. Replaces the old
# claude.ai routine that scraped ephemeral Railway stdout logs and quietly
# posted an error page when its token was missing.
#
# IMPORTANT: this job works only from the durable query_log-backed analytics
# JSON API. It does NOT read the indexed repos and does NOT reproduce queries
# against the live MCP — doing so would self-inflate the analytics it measures.
#
# Fail-loud: unlike the retired routine, a run that cannot fetch its data (or
# cannot publish) exits non-zero and posts a Slack alert to #oss-alerts instead
# of publishing a degraded "could not generate" page. A red run + Slack alert is
# the intended signal.
#
# On SUCCESS, the script additionally posts a one-line digest to #engr (a SEPARATE
# webhook from the failure alert) so a healthy weekly report is visible to
# engineering. The success ping is best-effort: an unset success webhook simply
# skips the ping and never affects the exit code or any fail-loud path.
#
# Required secrets (the run fails without them):
#   PATHFINDER_ANALYTICS_TOKEN  Bearer token for GET /api/analytics/* on the
#                               production MCP (https://mcp.copilotkit.ai). When
#                               unset, the script FAILS LOUD (non-zero exit +
#                               Slack alert) — the report cannot run without it.
#   NOTION_TOKEN                Notion integration token used to publish the
#                               report page. A publish failure is fail-loud.
#
# Optional secrets (the run still works without them):
#   SLACK_WEBHOOK_OSS_ALERTS    Org-level secret: incoming-webhook URL for
#                               #oss-alerts. Mapped to the script's
#                               SLACK_WEBHOOK env. Posted to only on FAILURE.
#                               When unset, the alert no-ops but the non-zero
#                               exit still stands.
#   SLACK_WEBHOOK_ENGR          Org-level secret: incoming-webhook URL for #engr
#                               (B0T app). Mapped to the script's
#                               SLACK_ENGR_WEBHOOK env. Posted to only on SUCCESS
#                               (the weekly digest). When unset, the success
#                               ping is simply skipped.
#   SHARED_CLIENT_IDS           Repository secret: OAuth client ids, separated
#                               by commas or newlines (one per line works), that
#                               many users share (a hosted connector reusing one
#                               DCR registration). The headline counts their
#                               rows by IP + User-Agent instead (rows with no
#                               usable IP still count by client id). Kept out of
#                               git on purpose. When unset, every client id is
#                               one client. When SET, the server must confirm
#                               the list (shared_client_ids_applied in
#                               /summary); if it does not (an older
#                               deployment), the run FAILS LOUD.
on:
  schedule:
    # Weekly, Sunday ~09:07 UTC — off the :00 mark to avoid the cron stampede.
    # With REPORT_DAYS=7 a Sunday run reports 7 UTC calendar days, Monday through
    # Sunday inclusive, but Sunday only up to the run time (~09:07 UTC), so most
    # of Sunday's traffic is not in the report (see reportWindow in the script).
    - cron: "7 9 * * 0"
  workflow_dispatch:

# Stateless report — no prior-run artifact to read, so no `actions: read`.
permissions:
  contents: read

jobs:
  weekly-search-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - run: npm ci

      - name: Run weekly search report
        env:
          # Read-only analytics access. Unset → script FAILS LOUD (no token,
          # no report). This secret already exists in the repo (shared with
          # monthly-gap-analysis).
          PATHFINDER_ANALYTICS_TOKEN: ${{ secrets.PATHFINDER_ANALYTICS_TOKEN }}
          # Notion publish target. Publish failure is fail-loud.
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # Slack alert (failure only → #oss-alerts). The script reads
          # SLACK_WEBHOOK; the org-level secret is SLACK_WEBHOOK_OSS_ALERTS.
          # Unset → alert no-ops, non-zero exit still stands.
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_OSS_ALERTS }}
          # Slack success digest (success only → #engr). The script reads
          # SLACK_ENGR_WEBHOOK; the org-level secret is SLACK_WEBHOOK_ENGR.
          # Unset → the success ping is simply skipped.
          SLACK_ENGR_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_ENGR }}
          # Gap Reports page where weekly reports land.
          NOTION_PARENT_PAGE_ID: "3793aa38-1852-80a5-89d3-c3d37147aa22"
          # Production analytics API base.
          ANALYTICS_BASE_URL: "https://mcp.copilotkit.ai"
          # 7-day lookback window.
          REPORT_DAYS: "7"
          # OAuth client ids that many users share (separated by commas or
          # newlines). Rows with these ids are counted as clients by IP +
          # User-Agent (rows with no usable IP still count by client id). The
          # value lives only in the repository secret; set it with
          # `gh secret set SHARED_CLIENT_IDS --repo CopilotKit/pathfinder`.
          # Unset → empty → no ids are shared. Set → the run fails if the
          # server does not confirm the list.
          SHARED_CLIENT_IDS: ${{ secrets.SHARED_CLIENT_IDS }}
        run: npx tsx scripts/weekly-search-report/weekly-search-report.ts --report /tmp/weekly-report.md

      # Keep the rendered report as a build artifact for inspection. The script
      # writes --report before it publishes, so the report survives a failed
      # Notion publish (the run still fails). NOTION_TOKEN is required.
      - name: Upload weekly report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-search-report
          path: /tmp/weekly-report.md
          if-no-files-found: ignore
