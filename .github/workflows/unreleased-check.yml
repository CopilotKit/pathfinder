name: Unreleased Changes Check
on:
  schedule:
    - cron: "0 16 * * *" # Daily at 9 AM Pacific
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for unreleased source changes
        id: unreleased
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="v${PKG_VERSION}"

          # If the tag doesn't exist yet, this is the release commit itself — skip
          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} not found — this push likely IS the release. Skipping."
            exit 0
          fi

          # Count source-file commits since the last release tag
          UNRELEASED=$(git log "${TAG}..HEAD" --oneline -- 'src/' | wc -l | tr -d ' ')

          if [ "$UNRELEASED" -gt 0 ]; then
            # Only alert if the oldest unreleased commit is >24h old
            OLDEST_TS=$(git log "${TAG}..HEAD" --format='%ct' --reverse -- 'src/' | head -1)
            NOW_TS=$(date +%s)
            AGE_HOURS=$(( (NOW_TS - OLDEST_TS) / 3600 ))

            if [ "$AGE_HOURS" -lt 24 ]; then
              echo "Unreleased commits exist but oldest is only ${AGE_HOURS}h old — skipping alert."
              exit 0
            fi

            echo "::warning::${UNRELEASED} source commits on main since ${TAG} (oldest: ${AGE_HOURS}h) — version has not been bumped."
            echo ""
            echo "Unreleased commits:"
            git log "${TAG}..HEAD" --oneline -- 'src/'
            echo ""
            echo "Run: bump package.json version, update CHANGELOG.md, push to trigger publish."
            echo "count=$UNRELEASED" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "No unreleased source changes since ${TAG}."
          fi

      - name: Notify Slack — unreleased changes
        if: steps.unreleased.outputs.count
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            payload=$(jq -nc --arg count "$UNRELEASED_COUNT" --arg tag "$UNRELEASED_TAG" --arg repo "$GH_REPOSITORY" \
              '{text: "Unreleased changes on main — \($count) commits since \($tag)\n<https://github.com/\($repo)/compare/\($tag)...main|View compare>"}')
            curl -sf -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "$payload" || true
          fi
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          GH_REPOSITORY: ${{ github.repository }}
          UNRELEASED_COUNT: ${{ steps.unreleased.outputs.count }}
          UNRELEASED_TAG: ${{ steps.unreleased.outputs.tag }}
