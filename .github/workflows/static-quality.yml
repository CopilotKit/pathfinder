name: Static Quality
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: npm ci
      # Also cover these scripts/ paths: gap-analysis/, weekly-search-report/
      # and the top-level scripts/*.mjs files. The other scripts/ files
      # predate this gate and are not checked here.
      - run: npx prettier --check "src/**/*.ts" "scripts/gap-analysis/**/*.ts" "scripts/weekly-search-report/**/*.ts" "scripts/*.mjs"

  test-shapes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: npm ci
      # Self-test FIRST, and as its own step so a failure is unambiguous. The
      # checker's rules run off shared AST helpers, and a bug in one of those
      # silently disables rules while the check still reports success — that
      # happened twice while writing it. This step proves each rule still fires
      # on its known-bad fixture and still tolerates the near-miss beside it, so
      # the ✓ from the next step means something.
      - run: node scripts/check-test-shapes.mjs --self-test
      # Ratchet over src/__tests__: a per-file violation count may fall, never
      # rise. Pre-existing violations are recorded in
      # scripts/check-test-shapes.baseline.json.
      - run: node scripts/check-test-shapes.mjs

  typecheck-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: npm ci
      # The root tsconfig excludes scripts/ (rootDir: src), so `npm run build`
      # never type-checks them. tsconfig.scripts.json type-checks
      # scripts/gap-analysis and scripts/weekly-search-report (and their tests)
      # without emitting. Other scripts, such as
      # scripts/update-competitive-matrix.ts, are not type-checked here.
      - run: npx tsc --noEmit -p tsconfig.scripts.json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build

  version-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: ./scripts/check-version-sync.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build
      - run: npm test
