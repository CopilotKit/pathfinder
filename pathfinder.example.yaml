tools:
  # Semantic search (RAG) — requires embedding config below
  - name: search-docs
    type: search
    description: "Search documentation for relevant information."
    source: docs
    default_limit: 5
    max_limit: 20
    result_format: docs
    # search_mode: vector   # 'vector' (default) | 'keyword' | 'hybrid'

  # Filesystem exploration — no database or API keys needed
  - name: explore-docs
    type: bash
    description: "Explore documentation files using bash commands (find, grep, cat, ls, head)."
    sources: [docs]
    bash:
      session_state: true
      grep_strategy: hybrid # memory | vector | hybrid
      virtual_files: true

  # ── Knowledge tool (for FAQ/Q&A sources) ──
  #  - name: get-faq
  #    type: knowledge
  #    description: "Browse and search community Q&A"
  #    sources: [community]

  # ── Atlas search tool ──
  #  - name: atlas-search
  #    type: search
  #    description: "Search Atlas codebase knowledge."
  #    source: atlas
  #    default_limit: 5
  #    max_limit: 20
  #    result_format: raw
  #    search_mode: hybrid

# Required for search tools (omit for bash-only mode)
embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536

# ── Ollama (local, requires ollama running with model pulled) ──
# embedding:
#   provider: ollama
#   model: nomic-embed-text
#   dimensions: 768
#   base_url: http://localhost:11434

# ── Local transformers.js (zero external deps, CPU-only) ──
# embedding:
#   provider: local
#   model: Xenova/all-MiniLM-L6-v2
#   dimensions: 384

indexing:
  auto_reindex: true
  reindex_hour_utc: 3
  stale_threshold_hours: 24

# ── Analytics (query logging and dashboard) ──
# analytics:
#   enabled: true
#   log_queries: true
#   retention_days: 90
#   # Machines that forward somebody else's text into the tools verbatim (an
#   # issue-triage bot, a mirroring service). Real traffic, but not user
#   # queries — matching rows are excluded from every default (real-user)
#   # analytics reader: the summary totals, empty and low-confidence rates,
#   # latency, per-day and per-source counts, unique-IP/session counts, Top
#   # Queries, empty queries, the tool counts and breakdown, and the Atlas
#   # user-query denominator. So they also drop out of the weekly search
#   # report and the gap analysis. Only the summary's all-time total and the
#   # dashboard's "Blocked Queries" panel keep them (that panel has no
#   # request-source filter). They are enumerated in the dashboard's
#   # "Excluded Machine-Relay Traffic" panel.
#   # A rule matches when EVERY predicate it declares matches.
#   #
#   # Prefer having the relay send `X-Pathfinder-Source: relay` on every
#   # request (2026-07-28 clients) or at session init (2025-era clients) —
#   # that tags its rows directly and needs no rule here. A relay that
#   # would rather send its own service name can, but only if that name is
#   # added to REQUEST_SOURCE_ALIASES in src/db/analytics.ts first: an
#   # unrecognized value is tagged 'user' like any other traffic (the server
#   # logs a warning naming it). These fingerprints are for relays you do not
#   # control, or have not taught to tag themselves yet.
#   machine_relays:
#     - name: github-issue-triage
#       reason: Forwards GitHub issue bodies verbatim into search
#       user_agent: node
#       client_ip_cidr: 152.55.176.0/20
